name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Package & publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the tag matches package.json
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi
          echo "releasing v${version}"

      - name: Verify the committed bundle
        run: |
          node scripts/build.mjs --check
          node scripts/check.mjs

      - name: Package the installable bundle
        run: |
          zip -r "dsh-ink-panel-${GITHUB_REF_NAME}.zip" \
            index.js client.js cordis.patch.yml package.json \
            locale docs icon.svg README.md LICENSE
          unzip -l "dsh-ink-panel-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dsh-ink-panel-${GITHUB_REF_NAME}.zip" \
            --title "dsh-ink-panel ${GITHUB_REF_NAME}" \
            --generate-notes
